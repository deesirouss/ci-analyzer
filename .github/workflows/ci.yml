name: CI + AI Failure Analyzer

on:
  push:
    branches: [main, dev]

jobs:
  # ─── Job 1: Build ────────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  # ─── Job 2: AI Failure Analyzer ──────────────────────────────────────────────
  # Triggered only when the build job fails (if: failure()).
  # Two steps in one job so the log file written in Step 1 is available to Step 2
  # without needing artifact upload/download between jobs.
  # If Step 1 (analysis) fails, Step 2 (PR creation) is automatically skipped.
  analyze-failure:
    name: analyze-failure
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install google-genai==2.20.0

      - name: Download failed build job logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JOB_ID=$(gh api \
            /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '.jobs[] | select(.name == "build") | .id')

          echo "Build job ID: $JOB_ID"

          gh api /repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs \
            --allow-escape-sequences \
            > ci_failure.log

          echo "Log downloaded: $(wc -l < ci_failure.log) lines"

      # ── Step 1: AI analysis (Tools 1–4) ──────────────────────────────────────
      # Extracts error lines → searches knowledge base → Gemini analysis → Gemini PR draft
      # Writes analysis.json — read by Step 2.
      # If this step fails, Step 2 is automatically skipped.
      - name: "Step 1 — AI Log Analysis (RAG + Gemini)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          RUN_ID: ${{ github.run_id }}
          PYTHONUNBUFFERED: "1"
        run: python3 .github/scripts/analyze_log.py

      # ── Step 2: Create PR (Tool 5) ────────────────────────────────────────────
      # Pure git + GitHub CLI. No AI calls. Reads analysis.json from Step 1.
      # GEMINI_API_KEY not needed here — better secrets hygiene.
      - name: "Step 2 — Create Fix PR (git + gh)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
          PYTHONUNBUFFERED: "1"
        run: python3 .github/scripts/create_pr.py
